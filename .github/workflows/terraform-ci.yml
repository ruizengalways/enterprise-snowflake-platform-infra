name: Terraform CI

on:
  pull_request:
    paths:
      - ".github/workflows/terraform-*.yml"
      - ".terraform-version"
      - "config/organization.yml"
      - "config/environments/**"
      - "terraform/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-*.yml"
      - ".terraform-version"
      - "config/organization.yml"
      - "config/environments/**"
      - "terraform/**"

permissions:
  contents: read

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

  validate:
    name: validate ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - organization
          - identity/dev
          - identity/uat
          - identity/prod
          - dev
          - uat
          - prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Terraform init with committed lock file
        working-directory: terraform/stacks/${{ matrix.stack }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        working-directory: terraform/stacks/${{ matrix.stack }}
        run: terraform validate -no-color
