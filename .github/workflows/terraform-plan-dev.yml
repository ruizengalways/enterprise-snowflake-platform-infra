name: Terraform Plan DEV

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-dev
  cancel-in-progress: false

jobs:
  plan:
    name: plan DEV
    runs-on: ubuntu-latest
    environment: dev

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # Empty defaults to azurerm for the Microsoft-first reference path.
      TF_STATE_BACKEND: ${{ vars.TF_STATE_BACKEND }}

      # Azure Blob inputs (only when backend=azurerm).
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}

      # AWS S3 inputs (only when backend=s3).
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      AWS_TERRAFORM_STATE_ROLE_ARN: ${{ vars.AWS_TERRAFORM_STATE_ROLE_ARN }}

      # Snowflake WIF is independent of the state backend.
      SNOWFLAKE_ORGANIZATION_NAME: ${{ vars.SNOWFLAKE_ORGANIZATION_NAME }}
      SNOWFLAKE_ACCOUNT_NAME: ${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_OIDC_AUDIENCE: ${{ vars.SNOWFLAKE_OIDC_AUDIENCE }}
      SNOWFLAKE_AUTHENTICATOR: WORKLOAD_IDENTITY
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve and verify environment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          backend="${TF_STATE_BACKEND:-azurerm}"
          case "${backend}" in
            azurerm|s3) ;;
            *)
              echo "TF_STATE_BACKEND must be 'azurerm' or 's3'; got '${backend}'." >&2
              exit 1
              ;;
          esac
          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "TF_STATE_BACKEND=${backend}" >> "${GITHUB_ENV}"

          for name in \
            SNOWFLAKE_ORGANIZATION_NAME \
            SNOWFLAKE_ACCOUNT_NAME \
            SNOWFLAKE_OIDC_AUDIENCE; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub environment variable: ${name}" >&2
              exit 1
            fi
          done

          if [[ "${backend}" == "azurerm" ]]; then
            for name in \
              ARM_TENANT_ID \
              ARM_CLIENT_ID \
              TF_STATE_STORAGE_ACCOUNT \
              TF_STATE_CONTAINER; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing required Azure backend variable: ${name}" >&2
                exit 1
              fi
            done
          else
            for name in \
              TF_STATE_BUCKET \
              TF_STATE_REGION \
              AWS_TERRAFORM_STATE_ROLE_ARN; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing required S3 backend variable: ${name}" >&2
                exit 1
              fi
            done
          fi

      - name: Select Terraform backend profile
        shell: bash
        run: bash terraform/scripts/select-backend.sh "${TF_STATE_BACKEND}" terraform/stacks/dev

      - name: Configure AWS credentials for S3 state
        if: steps.config.outputs.backend == 's3'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_STATE_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
          role-session-name: snowflake-tf-dev-${{ github.run_id }}

      - name: Request GitHub OIDC token for Snowflake
        shell: bash
        run: |
          set -euo pipefail

          snowflake_user="$(awk '
            /^terraform_identity:/ { in_identity=1; next }
            in_identity && /^  user_name:/ { print $2; exit }
          ' config/environments/dev.yml)"

          if [[ -z "${snowflake_user}" ]]; then
            echo "Could not resolve terraform_identity.user_name from DEV config." >&2
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --get \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${SNOWFLAKE_OIDC_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"

          token="$(jq -er '.value' <<<"${response}")"
          echo "::add-mask::${token}"
          echo "SNOWFLAKE_TOKEN=${token}" >> "${GITHUB_ENV}"
          echo "SNOWFLAKE_USER=${snowflake_user}" >> "${GITHUB_ENV}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Terraform init with Azure Blob state
        if: steps.config.outputs.backend == 'azurerm'
        working-directory: terraform/stacks/dev
        shell: bash
        run: |
          terraform init \
            -input=false \
            -lockfile=readonly \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=enterprise-snowflake-platform-infra/platform/dev/terraform.tfstate"

      - name: Terraform init with S3 state
        if: steps.config.outputs.backend == 's3'
        working-directory: terraform/stacks/dev
        shell: bash
        run: |
          terraform init \
            -input=false \
            -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=enterprise-snowflake-platform-infra/platform/dev/terraform.tfstate" \
            -backend-config="region=${TF_STATE_REGION}"

      - name: Terraform validate
        working-directory: terraform/stacks/dev
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: terraform/stacks/dev
        run: terraform plan -input=false -lock-timeout=5m -no-color
