name: Platform Control SQL CI

on:
  pull_request:
    paths:
      - "config/environments/**"
      - "snowflake/control/operations/**"
      - "snowflake/control/config/**"
      - ".github/workflows/platform-control-sql-ci.yml"
      - ".github/workflows/platform-control-sql-deploy-dev.yml"
  push:
    branches:
      - main
    paths:
      - "config/environments/**"
      - "snowflake/control/operations/**"
      - "snowflake/control/config/**"
      - ".github/workflows/platform-control-sql-ci.yml"
      - ".github/workflows/platform-control-sql-deploy-dev.yml"

permissions:
  contents: read

jobs:
  domain-access:
    name: validate domain-scoped control access
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: snowflake/control/operations/requirements.txt

      - name: Install renderer dependency
        run: python -m pip install -r snowflake/control/operations/requirements.txt

      - name: Run renderer and topology unit tests
        run: python -m unittest discover -s snowflake/control/operations/tests -p 'test_*.py' -v

      - name: Render every environment control surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/platform-control"
          for env in dev uat prod; do
            python snowflake/control/operations/render_domain_access.py \
              --config "config/environments/${env}.yml" \
              --output "${RUNNER_TEMP}/platform-control/${env}-operational.sql"
            python snowflake/control/operations/render_domain_bootstrap_access.py \
              --config "config/environments/${env}.yml" \
              --output "${RUNNER_TEMP}/platform-control/${env}-bootstrap.sql"
            python snowflake/control/config/render_domain_config_access.py \
              --config "config/environments/${env}.yml" \
              --output "${RUNNER_TEMP}/platform-control/${env}-config.sql"
            test -s "${RUNNER_TEMP}/platform-control/${env}-operational.sql"
            test -s "${RUNNER_TEMP}/platform-control/${env}-bootstrap.sql"
            test -s "${RUNNER_TEMP}/platform-control/${env}-config.sql"
          done

      - name: Render ordered deployment bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/platform-control-bundles"
          for env in dev uat prod; do
            python snowflake/control/operations/render_deployment_bundle.py \
              --config "config/environments/${env}.yml" \
              --output "${RUNNER_TEMP}/platform-control-bundles/${env}.sql"
            BUNDLE="${RUNNER_TEMP}/platform-control-bundles/${env}.sql"
            test -s "$BUNDLE"
            grep -q -- '-- BEGIN BASE: pipeline_checkpoint.sql' "$BUNDLE"
            grep -q -- '-- BEGIN BASE: pipeline_bootstrap.sql' "$BUNDLE"
            grep -q -- '-- BEGIN BASE: dataset_config_snapshot.sql' "$BUNDLE"
            grep -q -- '-- BEGIN GENERATED: normal domain operational access' "$BUNDLE"
            grep -q -- '-- BEGIN GENERATED: bootstrap handoff access' "$BUNDLE"
            grep -q -- '-- BEGIN GENERATED: dataset config snapshot access' "$BUNDLE"
          done

      - name: Render post-deploy verification SQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/platform-control-verification"
          for env in dev uat prod; do
            python snowflake/control/operations/render_verification_sql.py \
              --config "config/environments/${env}.yml" \
              --output "${RUNNER_TEMP}/platform-control-verification/${env}.sql"
            VERIFY="${RUNNER_TEMP}/platform-control-verification/${env}.sql"
            test -s "$VERIFY"
            grep -q 'PLATFORM_CONTROL.INFORMATION_SCHEMA.VIEWS' "$VERIFY"
            grep -q 'PLATFORM_CONTROL.INFORMATION_SCHEMA.PROCEDURES' "$VERIFY"
            grep -q 'PLATFORM_CONTROL.INFORMATION_SCHEMA.OBJECT_PRIVILEGES' "$VERIFY"
            grep -q "OBJECT_SCHEMA = 'CONFIG'" "$VERIFY"
            grep -q 'DATASET_CONFIG_SNAPSHOT' "$VERIFY"
            grep -q 'E_FORBIDDEN_GRANT' "$VERIFY"
          done

      - name: Assert no shared-table project DML grants are rendered
        shell: bash
        run: |
          set -euo pipefail
          if grep -REi \
            'GRANT[[:space:]]+(SELECT|INSERT|UPDATE|DELETE|TRUNCATE|REFERENCES)[[:space:]]+ON[[:space:]]+TABLE[[:space:]]+PLATFORM_CONTROL\.(OPERATIONS\.PIPELINE_|CONFIG\.DATASET_CONFIG_SNAPSHOT)' \
            "${RUNNER_TEMP}/platform-control"; then
            echo "Rendered SQL grants a project role direct access to a shared control table." >&2
            exit 1
          fi

      - name: Assert project/environment are server-fixed
        shell: bash
        run: |
          set -euo pipefail
          if grep -RE 'P_PROJECT_CODE|P_ENVIRONMENT' "${RUNNER_TEMP}/platform-control"; then
            echo "Rendered project write API exposes a caller-controlled project/environment parameter." >&2
            exit 1
          fi

      - name: Assert bootstrap checkpoint commit remains atomic
        shell: bash
        run: |
          set -euo pipefail
          for file in "${RUNNER_TEMP}"/platform-control/*-bootstrap.sql; do
            grep -q 'PIPELINE_BOOTSTRAP_COMMIT_HANDOFF' "$file"
            grep -q 'P_RECONCILIATION_PASSED BOOLEAN' "$file"
            grep -q 'RAISE E_RECONCILIATION_FAILED' "$file"
            grep -q 'RAISE E_CHECKPOINT_EXISTS' "$file"
            grep -q 'RAISE E_CHECKPOINT_CONFLICT' "$file"
            grep -q 'BEGIN TRANSACTION;' "$file"
            grep -q 'MERGE INTO PLATFORM_CONTROL.OPERATIONS.PIPELINE_CHECKPOINT' "$file"
            grep -q "SET STATUS = 'HANDOFF_COMMITTED'" "$file"
            grep -q 'WHEN OTHER THEN' "$file"
            grep -q 'ROLLBACK;' "$file"
          done

      - name: Assert config snapshots are immutable and conflict-safe
        shell: bash
        run: |
          set -euo pipefail
          for file in "${RUNNER_TEMP}"/platform-control/*-config.sql; do
            grep -q 'REGISTER_DATASET_CONFIG_SNAPSHOT' "$file"
            grep -q 'RAISE E_CONFIG_CONFLICT' "$file"
            grep -q 'dataset config snapshot already registered' "$file"
            if grep -Eqi 'GRANT[[:space:]]+(INSERT|UPDATE|DELETE|TRUNCATE)[[:space:]]+ON[[:space:]]+TABLE[[:space:]]+PLATFORM_CONTROL\.CONFIG\.DATASET_CONFIG_SNAPSHOT' "$file"; then
              echo "Config renderer exposes direct base-table mutation." >&2
              exit 1
            fi
          done
