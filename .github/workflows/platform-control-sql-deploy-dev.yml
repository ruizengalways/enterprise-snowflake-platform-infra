name: Platform Control SQL Deploy DEV

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-control-sql-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy complete PLATFORM_CONTROL v2 bundle to DEV
    runs-on: ubuntu-latest
    environment: dev

    env:
      SNOWFLAKE_ORGANIZATION_NAME: ${{ vars.SNOWFLAKE_ORGANIZATION_NAME }}
      SNOWFLAKE_ACCOUNT_NAME: ${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_OIDC_AUDIENCE: ${{ vars.SNOWFLAKE_OIDC_AUDIENCE }}
      SNOWFLAKE_AUTHENTICATOR: WORKLOAD_IDENTITY
      SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER: OIDC
      SNOWFLAKE_ENHANCED_EXIT_CODES: "1"
      PLATFORM_CONTROL_BUNDLE: /tmp/platform-control-dev.sql

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: snowflake/control/operations/requirements.txt

      - name: Install control renderer and Snowflake CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r snowflake/control/operations/requirements.txt
          python -m pip install "snowflake-cli==3.23.0"
          snow --version

      - name: Verify required environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SNOWFLAKE_ORGANIZATION_NAME \
            SNOWFLAKE_ACCOUNT_NAME \
            SNOWFLAKE_OIDC_AUDIENCE; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub environment variable: ${name}" >&2
              exit 1
            fi
          done
          if [[ "${SNOWFLAKE_OIDC_AUDIENCE}" == "snowflakecomputing.com" ]]; then
            echo "Use an account-scoped Snowflake OIDC audience, not snowflakecomputing.com." >&2
            exit 1
          fi

      - name: Render complete DEV PLATFORM_CONTROL bundle
        shell: bash
        run: |
          set -euo pipefail
          python snowflake/control/operations/render_deployment_bundle.py \
            --config config/environments/dev.yml \
            --output "${PLATFORM_CONTROL_BUNDLE}"

          # Fail closed if a future renderer change silently drops a control family.
          grep -Fq -- '-- BEGIN BASE: pipeline_checkpoint.sql' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq -- '-- BEGIN BASE: pipeline_bootstrap.sql' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq -- '-- BEGIN BASE: dataset_lifecycle.sql' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq -- '-- BEGIN BASE: dataset_reset.sql' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq -- '-- BEGIN BASE: dataset_config_snapshot.sql' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq -- '-- BEGIN GENERATED: normal domain operational access' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq -- '-- BEGIN GENERATED: bootstrap handoff access' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq -- '-- BEGIN GENERATED: dataset reset access' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq -- '-- BEGIN GENERATED: dataset config snapshot access' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq 'HEALTH_DATASET_RESET_START' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq 'TRANSPORT_DATASET_RESET_START' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq 'HEALTH_REGISTER_DATASET_CONFIG_SNAPSHOT' "${PLATFORM_CONTROL_BUNDLE}"
          grep -Fq 'TRANSPORT_REGISTER_DATASET_CONFIG_SNAPSHOT' "${PLATFORM_CONTROL_BUNDLE}"

      - name: Resolve DEV platform identity and request Snowflake OIDC token
        shell: bash
        run: |
          set -euo pipefail

          snowflake_user="$(awk '
            /^terraform_identity:/ { in_identity=1; next }
            in_identity && /^  user_name:/ { print $2; exit }
          ' config/environments/dev.yml)"

          snowflake_role="$(awk '
            /^terraform_identity:/ { in_identity=1; next }
            in_identity && /^  role_name:/ { print $2; exit }
          ' config/environments/dev.yml)"

          if [[ -z "${snowflake_user}" || -z "${snowflake_role}" ]]; then
            echo "Could not resolve terraform_identity user/role from DEV config." >&2
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --get \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${SNOWFLAKE_OIDC_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"

          token="$(jq -er '.value' <<<"${response}")"
          echo "::add-mask::${token}"

          echo "SNOWFLAKE_TOKEN=${token}" >> "${GITHUB_ENV}"
          echo "SNOWFLAKE_USER=${snowflake_user}" >> "${GITHUB_ENV}"
          echo "SNOWFLAKE_ROLE=${snowflake_role}" >> "${GITHUB_ENV}"
          echo "SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ORGANIZATION_NAME}-${SNOWFLAKE_ACCOUNT_NAME}" >> "${GITHUB_ENV}"

      - name: Verify Snowflake workload identity
        shell: bash
        run: |
          set -euo pipefail
          snow sql \
            --temporary-connection \
            --account "${SNOWFLAKE_ACCOUNT}" \
            --user "${SNOWFLAKE_USER}" \
            --role "${SNOWFLAKE_ROLE}" \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --enable-templating NONE \
            --local-only \
            --enhanced-exit-codes \
            -q 'select current_organization_name(), current_account_name(), current_user(), current_role()'

      - name: Deploy complete PLATFORM_CONTROL bundle
        shell: bash
        run: |
          set -euo pipefail
          snow sql \
            --temporary-connection \
            --account "${SNOWFLAKE_ACCOUNT}" \
            --user "${SNOWFLAKE_USER}" \
            --role "${SNOWFLAKE_ROLE}" \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --enable-templating NONE \
            --local-only \
            --enhanced-exit-codes \
            -f "${PLATFORM_CONTROL_BUNDLE}"

      - name: Verify complete control-plane surfaces
        shell: bash
        run: |
          set -euo pipefail
          snow sql \
            --temporary-connection \
            --account "${SNOWFLAKE_ACCOUNT}" \
            --user "${SNOWFLAKE_USER}" \
            --role "${SNOWFLAKE_ROLE}" \
            --authenticator WORKLOAD_IDENTITY \
            --workload-identity-provider OIDC \
            --enable-templating NONE \
            --local-only \
            --enhanced-exit-codes \
            -q "
              select table_schema, table_name
              from PLATFORM_CONTROL.INFORMATION_SCHEMA.TABLES
              where (table_schema = 'OPERATIONS' and table_name in (
                'PIPELINE_CHECKPOINT','PIPELINE_RUN','PIPELINE_CHECK_RESULT',
                'PIPELINE_BOOTSTRAP','DATASET_LIFECYCLE','DATASET_RESET'
              )) or (table_schema = 'CONFIG' and table_name = 'DATASET_CONFIG_SNAPSHOT')
              order by table_schema, table_name;
              show views like 'HEALTH_%' in schema PLATFORM_CONTROL.OPERATIONS;
              show views like 'TRANSPORT_%' in schema PLATFORM_CONTROL.OPERATIONS;
              show procedures like 'HEALTH_%' in schema PLATFORM_CONTROL.OPERATIONS;
              show procedures like 'TRANSPORT_%' in schema PLATFORM_CONTROL.OPERATIONS;
              show procedures like 'HEALTH_%' in schema PLATFORM_CONTROL.CONFIG;
              show procedures like 'TRANSPORT_%' in schema PLATFORM_CONTROL.CONFIG;
            "
