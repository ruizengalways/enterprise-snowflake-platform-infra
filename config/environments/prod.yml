environment: prod
account:
  logical_name: PROD

terraform_identity:
  user_name: SU_GITHUB_TERRAFORM_PROD
  role_name: AR_TERRAFORM_PROD
  github_environment: prod
  oidc_issuer: https://token.actions.githubusercontent.com
  oidc_subject: repo:ruizengalways/enterprise-snowflake-platform-infra:environment:prod

project_deploy_identity:
  github_owner: ruizengalways
  github_environment: prod
  oidc_issuer: https://token.actions.githubusercontent.com

projects:
  health:
    code: HEALTH
    repository: enterprise-snowflake-health-analytics
    warehouse_keys:
      query: health_query
      transform: health_transform
  transport:
    code: TRANSPORT
    repository: enterprise-snowflake-transport-analytics
    warehouse_keys:
      query: transport_query
      transform: transport_transform

analytics_databases:
  health_prod:
    name: PROD_HEALTH
    project_code: HEALTH
    retention_days: 1
    schemas:
      - BRONZE
      - SILVER_STAGING
      - SILVER_INTERMEDIATE
      - SILVER_CANONICAL
      - GOLD_MARTS
      - GOLD_SEMANTIC
      - DQ
    published_schemas:
      - GOLD_MARTS
      - GOLD_SEMANTIC
  transport_prod:
    name: PROD_TRANSPORT
    project_code: TRANSPORT
    retention_days: 1
    schemas:
      - BRONZE
      - SILVER_STAGING
      - SILVER_INTERMEDIATE
      - SILVER_CANONICAL
      - GOLD_MARTS
      - GOLD_SEMANTIC
      - DQ
    published_schemas:
      - GOLD_MARTS
      - GOLD_SEMANTIC

platform_control:
  name: PLATFORM_CONTROL
  retention_days: 1
  schemas:
    - CONFIG
    - DEPLOYMENT
    - QUALITY
    - OBSERVABILITY
    - OPERATIONS

warehouses:
  health_transform:
    name: WH_HEALTH_TRANSFORM
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  health_query:
    name: WH_HEALTH_QUERY
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  transport_transform:
    name: WH_TRANSPORT_TRANSFORM
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  transport_query:
    name: WH_TRANSPORT_QUERY
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  platform_ops:
    name: WH_PLATFORM_OPS
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
