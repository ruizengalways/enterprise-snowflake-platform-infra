environment: prod
account:
  logical_name: PROD

projects:
  health:
    code: HEALTH
    repository: enterprise-snowflake-health-analytics
  transport:
    code: TRANSPORT
    repository: enterprise-snowflake-transport-analytics

analytics_databases:
  prod:
    name: ANALYTICS_PROD
    retention_days: 1
    schemas:
      - HEALTH_STAGING
      - HEALTH_INTERMEDIATE
      - HEALTH_CANONICAL
      - HEALTH_MARTS
      - HEALTH_SEMANTIC
      - TRANSPORT_STAGING
      - TRANSPORT_INTERMEDIATE
      - TRANSPORT_CANONICAL
      - TRANSPORT_MARTS
      - TRANSPORT_SEMANTIC

platform_control:
  name: PLATFORM_CONTROL
  retention_days: 1
  schemas:
    - DEPLOYMENT
    - QUALITY
    - OBSERVABILITY
    - OPERATIONS

warehouses:
  health_transform:
    name: WH_HEALTH_TRANSFORM
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  health_query:
    name: WH_HEALTH_QUERY
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  transport_transform:
    name: WH_TRANSPORT_TRANSFORM
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  transport_query:
    name: WH_TRANSPORT_QUERY
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  platform_ops:
    name: WH_PLATFORM_OPS
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
