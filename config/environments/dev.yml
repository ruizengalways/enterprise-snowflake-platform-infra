environment: dev
account:
  logical_name: DEV

terraform_identity:
  user_name: SU_GITHUB_TERRAFORM_DEV
  role_name: AR_TERRAFORM_DEV
  github_environment: dev
  oidc_issuer: https://token.actions.githubusercontent.com
  oidc_subject: repo:ruizengalways/enterprise-snowflake-platform-infra:environment:dev

project_ci_identity:
  github_owner: ruizengalways
  github_environment: ci
  oidc_issuer: https://token.actions.githubusercontent.com

projects:
  health:
    code: HEALTH
    repository: enterprise-snowflake-health-analytics
    warehouse_keys:
      query: health_query
      transform: health_transform
      ci: health_ci
  transport:
    code: TRANSPORT
    repository: enterprise-snowflake-transport-analytics
    warehouse_keys:
      query: transport_query
      transform: transport_transform
      ci: transport_ci

# Database boundary is environment x data product. CI stays in the DEV account
# but uses separate project databases so ephemeral PR work cannot collide with DEV.
analytics_databases:
  health_dev:
    name: DEV_HEALTH
    project_code: HEALTH
    retention_days: 1
    schemas:
      - STAGING
      - INTERMEDIATE
      - CANONICAL
      - MARTS
      - SEMANTIC
    published_schemas:
      - MARTS
      - SEMANTIC
  health_ci:
    name: CI_HEALTH
    project_code: HEALTH
    retention_days: 1
    # PR schemas are created/removed by delivery workflows, not Terraform state.
    schemas: []
    published_schemas: []
  transport_dev:
    name: DEV_TRANSPORT
    project_code: TRANSPORT
    retention_days: 1
    schemas:
      - STAGING
      - INTERMEDIATE
      - CANONICAL
      - MARTS
      - SEMANTIC
    published_schemas:
      - MARTS
      - SEMANTIC
  transport_ci:
    name: CI_TRANSPORT
    project_code: TRANSPORT
    retention_days: 1
    schemas: []
    published_schemas: []

platform_control:
  name: PLATFORM_CONTROL
  retention_days: 1
  schemas:
    - DEPLOYMENT
    - QUALITY
    - OBSERVABILITY
    - OPERATIONS

# Account already conveys DEV. Warehouse names therefore describe domain + workload,
# which makes the same logical workload names reusable across DEV/UAT/PROD accounts.
warehouses:
  health_query:
    name: WH_HEALTH_QUERY
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  health_transform:
    name: WH_HEALTH_TRANSFORM
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  health_ci:
    name: WH_HEALTH_CI
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 1800
  transport_query:
    name: WH_TRANSPORT_QUERY
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  transport_transform:
    name: WH_TRANSPORT_TRANSFORM
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
  transport_ci:
    name: WH_TRANSPORT_CI
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 1800
  platform_ops:
    name: WH_PLATFORM_OPS
    size: XSMALL
    auto_suspend_seconds: 60
    statement_timeout_seconds: 3600
